if(!THREE)throw Error('Unable to load Three.js. An internet connection is required.');
const scene=new THREE.Scene();scene.background=new THREE.Color('#a3b4b1');scene.fog=new THREE.FogExp2('#a3b4b1',.023);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,240);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const hemi=new THREE.HemisphereLight('#cfe4e6','#3a4431',1.9);scene.add(hemi);const sun=new THREE.DirectionalLight('#f5e5c7',2.0);sun.position.set(-35,70,25);scene.add(sun);
const material=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.94});const ground=material('#475c3a'),stone=material('#77776e'),iron=material('#24292b'),rust=material('#50443b'),trunk=material('#45362a'),leaf=[material('#243c2c'),material('#304a33'),material('#3a4b35'),material('#20352b')];
function box(x,y,z,w,h,d,m,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
box(0,-.6,-90,250,1.2,380,ground);
// Road runs east-west through the woods, with a subtle winding approach.
const nodes=[[0,90],[0,70],[-1,45],[0,20],[0,0],[1,-24],[0,-50],[-1,-78],[0,-105],[0,-140],[2,-174],[0,-210]];
function pathX(z){for(let i=1;i<nodes.length;i++){const a=nodes[i-1],b=nodes[i];if(z<=a[1]&&z>=b[1])return a[0]+(b[0]-a[0])*(z-a[1])/(b[1]-a[1]);}return 0}
const roadMat=material('#857f72'),edge=material('#696357');
for(let i=1;i<nodes.length;i++){const [x,z]=nodes[i-1],[xx,zz]=nodes[i],length=Math.hypot(xx-x,zz-z);const m=box((x+xx)/2,-.012,(z+zz)/2,9,.06,length+.7,roadMat);m.rotation.y=-Math.atan2(xx-x,zz-z);const l=box((x+xx)/2,-.05,(z+zz)/2,11,.045,length+.7,edge);l.rotation.y=m.rotation.y;}
// Repeated irregular stone paving: sparse to keep draw calls reasonable.
let seed=93471;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
const pebble=material('#9b978b');const pebbleGeom=new THREE.BoxGeometry(.24,.045,.33);const pebbleMesh=new THREE.InstancedMesh(pebbleGeom,pebble,3500);const temp=new THREE.Object3D();for(let i=0;i<3500;i++){const z=85-rand()*290,x=pathX(z)+(rand()-.5)*8.6;temp.position.set(x,.04,z);temp.rotation.y=rand()*Math.PI;temp.scale.set(.7+rand(),1,.7+rand());temp.updateMatrix();pebbleMesh.setMatrixAt(i,temp.matrix)}pebbleMesh.instanceMatrix.needsUpdate=true;scene.add(pebbleMesh);
// Forest trees in instanced batches, avoiding the road and the gate.
const trunkGeo=new THREE.CylinderGeometry(.19,.32,4.5,6),crownGeo=new THREE.ConeGeometry(2.3,7.3,7);const trunks=new THREE.InstancedMesh(trunkGeo,trunk,620);const crowns=leaf.map(m=>new THREE.InstancedMesh(crownGeo,m,155));const count=[0,0,0,0];for(let i=0;i<620;i++){let z=90-rand()*290,x=pathX(z)+(rand()<.5?-1:1)*(7+rand()*105);const scale=.7+rand()*.9;temp.position.set(x,2.1*scale,z);temp.rotation.y=rand()*6.28;temp.scale.set(scale,scale,scale);temp.updateMatrix();trunks.setMatrixAt(i,temp.matrix);const k=i%4;temp.position.set(x,6.7*scale,z);temp.rotation.y=rand()*6.28;temp.scale.set(scale,scale,scale);temp.updateMatrix();crowns[k].setMatrixAt(count[k]++,temp.matrix)}trunks.instanceMatrix.needsUpdate=true;scene.add(trunks);crowns.forEach(c=>{c.instanceMatrix.needsUpdate=true;scene.add(c)});
// Eastern Gates of Barovia, placed in the forest, NOT the village.
const gateZ=0,gateL=new THREE.Group(),gateR=new THREE.Group();gateL.position.set(-4.5,0,gateZ);gateR.position.set(4.5,0,gateZ);scene.add(gateL,gateR);
for(const x of [-5.2,5.2]){box(x,2.6,gateZ,1.5,5.2,1.7,stone);box(x,5.4,gateZ,1.9,.45,1.9,stone);const cap=new THREE.Mesh(new THREE.ConeGeometry(.9,1.2,4),stone);cap.position.set(x,6.25,gateZ);cap.rotation.y=Math.PI/4;scene.add(cap)}
function bar(p,x,y,z,w,h,d,m=iron){return box(x,y,z,w,h,d,m,p)}
for(const [p,dir] of [[gateL,1],[gateR,-1]]){bar(p,dir*2.15,1.05,0,4.3,.17,.16);bar(p,dir*2.15,3.35,0,4.3,.17,.16);for(let i=0;i<10;i++){const x=dir*(.23+i*.43);bar(p,x,2.2,0,.08,3.8,.12,i%4===0?rust:iron);const tip=new THREE.Mesh(new THREE.ConeGeometry(.14,.48,4),iron);tip.position.set(x,4.35,0);p.add(tip)}bar(p,dir*4.25,2.2,0,.18,3.9,.18,rust)}
const leftOpen=-Math.PI*.51,rightOpen=Math.PI*.51;gateL.rotation.y=leftOpen;gateR.rotation.y=rightOpen;
const player={x:0,z:32,angle:0},keys={};let triggered=false,progress=0,night=false,noticeUntil=0;
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function reset(){player.x=0;player.z=32;player.angle=0;triggered=false;progress=0;gateL.rotation.y=leftOpen;gateR.rotation.y=rightOpen;document.querySelector('#notice').style.display='none'}document.querySelector('#reset').onclick=reset;
document.querySelector('#day').onclick=()=>{night=!night;scene.background.set(night?'#101a30':'#a3b4b1');scene.fog.color.set(night?'#1a2632':'#a3b4b1');hemi.intensity=night?.65:1.9;sun.intensity=night?.3:2};
function clang(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=new A(),t=ac.currentTime;for(const [hz,amp] of [[117,.22],[248,.13],[510,.08],[861,.05]]){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(hz,t);o.frequency.exponentialRampToValueAtTime(hz*.84,t+.6);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(amp,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+1.3);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.31)}setTimeout(()=>ac.close(),1800)}catch(e){console.warn(e)}}
const map=document.querySelector('#map'),ctx=map.getContext('2d');function drawMap(){ctx.fillStyle='#45583f';ctx.fillRect(0,0,160,240);ctx.strokeStyle='#9e9989';ctx.lineWidth=10;ctx.beginPath();nodes.forEach(([x,z],i)=>{const xx=80+x*1.1,yy=30+(90-z)*.66;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke();ctx.strokeStyle='#d2cbb4';ctx.lineWidth=7;ctx.stroke();ctx.strokeStyle='#282e2e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(65,89);ctx.lineTo(95,89);ctx.stroke();ctx.fillStyle='#ffe02d';ctx.beginPath();ctx.arc(80+player.x*1.1,30+(90-player.z)*.66,4.5,0,Math.PI*2);ctx.fill()}
let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-prev)/1000,.05);prev=now;const t=2.2*dt;if(keys.arrowleft)player.angle-=t;if(keys.arrowright)player.angle+=t;const f=(keys.arrowup?1:0)-(keys.arrowdown?1:0),side=(keys.d?1:0)-(keys.a?1:0),speed=(keys.shift?10:5)*dt;player.x+=(Math.sin(player.angle)*f+Math.cos(player.angle)*side)*speed;player.z+=(-Math.cos(player.angle)*f+Math.sin(player.angle)*side)*speed;player.z=Math.max(-205,Math.min(85,player.z));player.x=Math.max(-100,Math.min(100,player.x));
if(!triggered&&player.z<-2&&Math.abs(player.x)<6){triggered=true;noticeUntil=now+3600;const n=document.querySelector('#notice');n.textContent='The iron gates slam shut behind you!';n.style.display='block'}if(triggered&&progress<1){const old=progress;progress=Math.min(1,progress+dt*.8);const v=progress*progress*(3-2*progress);gateL.rotation.y=leftOpen*(1-v);gateR.rotation.y=rightOpen*(1-v);if(old<1&&progress===1)clang()}if(triggered&&now>noticeUntil)document.querySelector('#notice').style.display='none';
camera.position.set(player.x,1.75,player.z);camera.rotation.set(0,-player.angle,0,'YXZ');document.querySelector('#pos').textContent=`Position ${Math.round(player.x)}, ${Math.round(player.z)}`;drawMap();renderer.render(scene,camera)}requestAnimationFrame(loop);window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};document.querySelector('#loading').remove();

const GAME_MAP=document.querySelector('#map')?.parentElement;
const gameLocations=[{"id": "INN", "name": "The Old Inn", "player": "To a party of seasoned adventurers such as yourselves, this is but another dull tavern in another dull town in some nameless province. It is but another passage of time between the challenges of true adventuring. Such is the doldrum of existence — waiting for another opportunity.\n\nOutside the Inn, a fog lies over the town this evening, draping everything in its clammy grasp. The damp cobbled street shines as the light of street lanterns dances across the slick stones. The cold fog chills the bones and shivers the soul of anyone outside.\n\nYet inside these tavern walls the food is hearty and the ale is warm and frothy. A fire blazes in the hearth and the tavern is alive with the tumbling voices of country folk.\n\nSuddenly, a hush falls over the tavern. Even the flagons of\nale seem to silence themselves. The tavern door swings open.\nFramed by the lamp-lit fog, a form strides into the room. His\nheavy, booted footfalls and the jingle of his coins shatter the\nsilence. His brightly colored clothes are draped in loose folds\nabout him and his hat hangs askew, hiding his eyes in shadows.\nWithout hesitation, he walks directly up to your table and\nstands proudly in a wide stance with folded arms.\nHis accented voice speaks, \"I have been sent to you to deliver\nthis messagel If you be creatures of honor, you will come to my\nmaster's aid at first light. It is not advisable to travel the Svalich\nwoods at night!\" He pulls from his tunic a sealed letter,\naddressed to all of you in beautiful flowing script. He drops the\nletter on the table. \"Take the west road from here some five\nhours march down through the Svalich woods. There you will\nfind my master in Barovia.\"\nAmid the continued silent stares of the patronage, the gypsy\nstrides to the bar and says to the wary barkeeper, \"Fill the\nglasses, one and all. Their throats are obviously parched.\" He\ndrops a purse heavy with gold on the bar. With that, he leaves.\nThe babble of tavern voices resumes, although somewhat\nsubdued. The letter is lying before you. Dated yesterday, the ink\nis still not dry and the parchment is crisp. The seal is of a crest\nyou don't recognize.", "dm": "Planned Encounters, opening inn: the PCs begin at an old inn east of Barovia. A messenger arrives with a sealed invitation supposedly from the Burgomaster. Present the letter from the original module. The players can make preparations before setting out.", "x": 1000, "z": 1000, "r": 0}, {"id": "A", "name": "The Old Svalich Road", "player": "Black pools of water stand like dark mirrors about the muddy roadway. Thick, cold mists spread a pallor over the road. Giant tree trunks stand on both sides of the road, their branches clawing into the mists. In every direction the mists grow thicker and the forest grows more oppressive.", "dm": "The journey from the opening inn to B, Gates of Barovia, takes five hours on the road.", "x": 0, "z": 53, "r": 15}, {"id": "B", "name": "The Gates of Barovia", "player": "Jutting from the impenetrable woods on both sides of the road, high stone buttresses loom up gray in the fog. Huge iron gates hang on the stonework. Dew clings with cold tenacity to the rusted bars. Two statues of armed guardians silently flank the gate. Their heads, missing from their shoulders, now lie among the weeds at their feet. They greet you only with silence.", "dm": "When PCs approach within 50 feet, the gates open and then close after they pass. They will not open for PCs from within Barovia; crossing the border brings the magical fog's choking effect. See the Lands of Barovia rules.", "x": 0, "z": 0, "r": 13}, {"id": "C", "name": "The Svalich Woods", "player": "Towering trees, whose tops are lost in heavy gray mist, block out all save a death-gray light. The tree trunks almost touch. The thick, damp undergrowth presses in on you, making it impossible even to see one another at all times. The woods have the silence of a forgotten grave, yet exude the feeling of an unsounded scream.", "dm": "After three turns in the woods, PCs find a dead villager with an envelope bearing the Burgomaster's genuine warning. The module also prescribes wolf howling checks and attacks while in the woods. Use the original text and statistics for timing and resolution.", "x": 0, "z": -68, "r": 27}, {"id": "D", "name": "The River Ivlis", "player": "The river Ivlis flows as clear as a blue winter sky through the valley.", "dm": "A geographic landmark on Map 1. The bridge in this prototype represents the river crossing; the precise bridge shape is interpretive.", "x": 1000, "z": 1000, "r": 0}, {"id": "E", "name": "Village of Barovia", "player": "Tall shapes loom out of the dense fog that surrounds everything. The muddy ground underfoot gives way to slick, wet cobblestones. The tall shapes become recognizable as the dwellings of the village of Barovia. The windows of each house stare out from pools of black nothingness. No sound cuts the silence except for a single mournful sobbing that echoes through the streets from a distance.", "dm": "The village's E1–E7 keyed locations are represented in the separate Village of Barovia walkthrough. Most shops are abandoned, with exceptions E1 and E2. See the original module for home occupancy and encounter rules.", "x": 1000, "z": 1000, "r": 0}, {"id": "F", "name": "Road Junction", "player": "Suddenly, the road splits into the forbidding Svalich woods. The northern fork slants up slightly to the north while the southern fork slants slightly downward. Dense fog obscures your vision. A cold autumn wind whistles down the northern lane, cutting icily through your clothing. Dead brown leaves rush about. There is no sound other than the wind and leaves.", "dm": "The northern fork leads to G, the Tser Pool encampment. The southern road leads toward I, the carriage.", "x": 1000, "z": 1000, "r": 0}, {"id": "G", "name": "Tser Pool Encampment", "player": "The canopy of mist and branches overhead suddenly gives way to black clouds boiling far above. There is a clearing here. Dry, brittle grass rustles in the biting wind. On the far side of the clearing are several colorful wagons parked on the banks of a pool. The mournful strains of an accordion mix meekly with the moaning of the wind. Several brightly clad figures surround a large, roaring fire. The road seems to pass close by this camp.", "dm": "There are ten Vistani at the camp, who invite PCs to join them. A member of the troupe leads them to Madam Eva at G1. Use the original module for reactions, character statistics and the Fortunes of Ravenloft reading.", "x": 1000, "z": 1000, "r": 0}, {"id": "G1", "name": "Madam Eva's Tent", "player": "Within, all is dimly illuminated in pools of red light. A small, low table stands across from the doorway, covered in a black velvet cloth. Glints of light seem to flash from a crystal ball on the table as a hunched figure peers into its depths. She speaks. Her voice crackles like dry weeds. Her tone soars and falls like the wind outside. \"At last you have arrived!\" Her sudden cackling laughter bursts like mad lightning from her withered lips.", "dm": "Madam Eva offers to read the PCs' fortunes. The DM should perform the Fortunes of Ravenloft procedure from the original module; a new reading supersedes the previous results. Madam Eva is a level-10 cleric, neutral, and cunning. This prototype does not automatically generate the fortune reading.", "x": 1000, "z": 1000, "r": 0}, {"id": "H", "name": "Tser Falls", "player": "This is the bottom of the falls. There is nothing of any interest here. A stone bridge can be seen nearly a thousand feet overhead.", "dm": "The stone bridge above the waterfall is described as nearly one thousand feet overhead. In this alpha its scale and terrain are intentionally condensed.", "x": 1000, "z": 1000, "r": 0}, {"id": "I", "name": "The Carriage", "player": "Once again you continue down the fog-shrouded road, dead leaves crackling along your track. The road splits in two. The dirt road continues to the northwest while a wide road leads east into the heart of the dense forest. Patches of cobblestone show up through the east road, telling that it was once a great road. To the right side of the fork stands a large carriage with two horses. Both horses are black as pitch. The horses snort violent puffs of steamy breath into the chill air. The carriage door swings open silently.", "dm": "The carriage is controlled by Strahd. Once PCs enter it, the horses travel to J, the Gates of Ravenloft, and cannot be discouraged. The carriage journey is represented by the road in this prototype; no automatic carriage ride yet.", "x": 1000, "z": 1000, "r": 0}, {"id": "J", "name": "The Gates of Ravenloft", "player": "After passing through the craggy peaks of the Balinoks, the road takes a sudden turn to the east and the startling awesome presence of Ravenloft itself towers before you. The carriage comes to a stop just in front of twin guardhouses of turreted stone, broken from years of use and exposure. Beyond these, a 50-foot-wide precipice gapes between the Balinok cliffs and the walls of Ravenloft, a chasm of dizzying depth that disappears into the fog-shrouded distance far below.", "dm": "A lowered drawbridge crosses the precipice between the approach and the castle. Continue using the original J boxed text for the drawbridge, gargoyles and gate tunnel. The castle's K1–K88 rooms are represented in the separate Castle Ravenloft walkthrough.", "x": 1000, "z": 1000, "r": 0}];
const gameEncounterTable=[["Opening Inn", "A messenger arrives with a forged Burgomaster letter; the adventure begins here."], ["A · Old Svalich Road", "Five-hour journey toward the gates; the dangerous fog and the forest set the scene."], ["B · Gates of Barovia", "The gates open for arrivals, close behind the party and will not open again until Strahd is destroyed. Two such gates exist in I6."], ["C · Svalich Woods", "After three turns, the party finds a dead villager carrying a genuine warning letter. Each turn in the woods, roll 1d6; 4–6 begins wolf howling, increasing by one wolf each round. After five rounds of howling, 5 worg wolves attack if entering Barovia, or 25 if trying to leave. They cease pursuit at the village. Worg wolves: AC 6; HD 4+4; damage 2–8."], ["D · River Ivlis", "River crossing and geographic landmark; use its module location text."], ["E · Village", "Village homes, closed shops, and E1–E7 encounters are in the separate village walkthrough."], ["F · Road Junction", "Fork toward the Tser Pool camp or the castle approach."], ["G · Tser Pool camp", "Vistani at the camp invite the party to join them; a guide leads them to Madam Eva."], ["G1 · Madam Eva", "The fortune reading determines important information and castle objectives; run the original Fortunes of Ravenloft procedure at the table."], ["H · Tser Falls", "Waterfall and bridge; dramatic terrain, no invented encounter added."], ["I · Carriage", "Strahd’s waiting carriage takes passengers toward the castle."], ["J · Gates of Ravenloft", "Guardhouses, chasm, drawbridge and approach to K1."]];

const MAP_X=l=>80+l.x*1.1,MAP_Y=l=>30+(90-l.z)*.66;

let gameDM=false,gameDesc=true,gameMap=true,gameKeys=true,gameIndex=0,gameLast=-1,torchOn=true;
const gameEl=id=>document.getElementById(id);
const gameEscape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function gameShowModal(title,body){gameEl('gameModalTitle').textContent=title;gameEl('gameModalBody').innerHTML=body;gameEl('gameModal').style.display='flex'}
function gameClose(){gameEl('gameModal').style.display='none'}
gameEl('gameClose').onclick=gameClose;gameEl('gameModal').onclick=e=>{if(e.target.id==='gameModal')gameClose()};
function gameRender(){const l=gameLocations[gameIndex];gameEl('gamePlace').textContent=l.id+' · '+l.name;gameEl('gameRead').textContent=l.player||'';gameEl('gameRead').hidden=!gameDesc;gameEl('gameNotes').hidden=!gameDM;gameEl('gameNotes').textContent=gameDM?(l.dm||'No DM notes provided.'):'';if(gameEl('jumpSelect'))gameEl('jumpSelect').value=String(gameIndex)}
function gameOpen(){const l=gameLocations[gameIndex];let body='<div class="readaloud">'+gameEscape(l.player)+'</div>';if(l.inside)body+='<h3>Inside / Exploration</h3><div class="readaloud">'+gameEscape(l.inside)+'</div>';if(gameDM)body+='<h3>DM ONLY</h3><div class="dmnote">'+gameEscape(l.dm||'')+'</div>';gameShowModal(l.name,body)}
function gameUpdateLocation(x,z){let best=Infinity,idx=-1;for(let i=0;i<gameLocations.length;i++){const l=gameLocations[i];if(!l.r)continue;const d=Math.hypot(x-l.x,z-l.z);if(d<best){best=d;idx=i}}if(idx>=0&&best<gameLocations[idx].r&&gameLast!==idx){gameLast=idx;gameIndex=idx;gameRender()}}
gameEl('dmBtn').onclick=()=>{gameDM=!gameDM;gameEl('dmBtn').textContent='DM: '+(gameDM?'ON':'OFF');gameEl('dmBtn').classList.toggle('on',gameDM);gameRender()};
gameEl('descBtn').onclick=()=>{gameDesc=!gameDesc;gameEl('descBtn').textContent=gameDesc?'Hide Descriptions':'Show Descriptions';gameRender()};
gameEl('mapBtn').onclick=()=>{gameMap=!gameMap;gameEl('mapBtn').textContent=gameMap?'Hide Map':'Show Map';GAME_MAP.style.display=gameMap?'':'none'};
gameEl('keysBtn').onclick=()=>{gameKeys=!gameKeys;gameEl('keysBtn').textContent=gameKeys?'Hide Key Locations':'Show Key Locations';gameEl('keyOverlay').style.display=gameKeys?'':'none'};
const gameMapTools=document.createElement('div');gameMapTools.id='mapTools';gameMapTools.innerHTML='<button id="mapKeys">Hide Key Locations</button><button id="mapCenter">Center</button>';GAME_MAP.append(gameMapTools);
gameEl('mapKeys').onclick=()=>gameEl('keysBtn').click();gameEl('mapCenter').onclick=()=>{gameMap=true;GAME_MAP.style.display='';gameEl('mapBtn').textContent='Hide Map'};
gameEl('exploreBtn').onclick=gameOpen;
if(gameEl('detailBtn'))gameEl('detailBtn').onclick=gameOpen;
const heldTurn={left:false,right:false};
for(const [id,side] of [['turnLeft','left'],['turnRight','right']]){const b=gameEl(id);b.addEventListener('pointerdown',e=>{heldTurn[side]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>heldTurn[side]=false)}
function gameTurnStep(){if(heldTurn.left)player.angle-=.045;if(heldTurn.right)player.angle+=.045;requestAnimationFrame(gameTurnStep)}requestAnimationFrame(gameTurnStep);
window.addEventListener('keydown',e=>{if(e.key==='Escape')gameClose();if(e.key.toLowerCase()==='e'&&!e.repeat&&gameEl('gameModal').style.display!=='flex')gameOpen()});
const keyOverlay=document.createElement('canvas');keyOverlay.id='keyOverlay';keyOverlay.width=480;keyOverlay.height=600;GAME_MAP.style.position='absolute';GAME_MAP.append(keyOverlay);
function drawKeys(){const c=keyOverlay.getContext('2d');c.clearRect(0,0,480,600);c.font='bold 14px Georgia';c.textAlign='center';for(const l of gameLocations){if(!l.r)continue;const x=MAP_X(l),y=MAP_Y(l);if(x<10||x>470||y<10||y>590)continue;c.fillStyle='#f4cf8a';c.fillRect(x-15,y-12,30,19);c.fillStyle='#3c2b1d';c.fillText(l.id,x,y+2)}}drawKeys();
function gameNav(path){window.location.href=path}
gameEl('castleBtn').onclick=()=>gameNav('ravenloft.html');
gameEl('encBtn').onclick=gameEncounter;
gameRender();setInterval(()=>gameUpdateLocation(player.x,player.z),250);

gameEl('villageBtn').onclick=()=>gameNav('village-of-barovia.html');
const jump=gameEl('jumpSelect');gameLocations.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.id+' · '+l.name;jump.append(o)});jump.onchange=()=>{if(jump.value==='')return;gameIndex=+jump.value;gameRender();gameOpen()};
function gameRoll(){const die=1+Math.floor(Math.random()*6);const hit=night?die<=2:die===1;gameShowModal('Outdoor Encounter Check','<p>1d6: <b>'+die+'</b> · '+(night?'Night':'Day')+' · '+(hit?'Encounter triggered':'No encounter')+'</p><p>Resolve the encounter using the original module tables.</p>')}
function gameEncounter(){let body='<p>DM reference · Lands of Barovia</p><button id="rollNow">Roll Encounter (1d6)</button>';for(const a of gameEncounterTable){body+='<p><b>'+gameEscape(a[0])+'</b></p><div class="dmnote">'+(gameDM?gameEscape(a[1]):'Enable DM mode for encounter details.')+'</div>'}gameShowModal('Lands of Barovia · Encounter Summary',body);gameEl('rollNow').onclick=gameRoll}

const sceneTorch=torchLight;
gameEl('torchBtn').onclick=()=>{torchOn=!torchOn;sceneTorch.intensity=torchOn?3.2:0;gameEl('torchBtn').textContent='🔥 Torch: '+(torchOn?'ON':'OFF');gameEl('torchBtn').classList.toggle('on',torchOn)};
}catch(e){console.error(e);document.querySelector('#loading').textContent='Unable to start: '+(e.stack||e.message||e)}
</script></body></html>
